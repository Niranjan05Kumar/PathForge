<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="26" height="26" fill="none">
  <!-- Rounded dark badge background -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#121418" stroke="#252830" stroke-width="1.2"/>
  
  <!-- Graph Path Edges (Gold) -->
  <path d="M16 8.5 L24 23.5 L8 23.5 Z" stroke="#f6ab3b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Top Vertex (Gold) -->
  <circle cx="16" cy="8.5" r="3.2" fill="#f6ab3b"/>

  <!-- Bottom-Right Vertex (Gold) -->
  <circle cx="24" cy="23.5" r="3.2" fill="#f6ab3b"/>

  <!-- Bottom-Left Vertex (Glowing White Source Node) -->
  <circle cx="8" cy="23.5" r="4.2" fill="#ffffff" fill-opacity="0.25"/>
  <circle cx="8" cy="23.5" r="3.2" fill="#ffffff"/>
</svg>
